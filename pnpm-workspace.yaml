# pnpm settings live here, NOT in package.json's "pnpm" field — pnpm 11 dropped
# that field entirely, so a package.json-only setting is silently ignored.
#
# Two dependencies need their install scripts to run. pnpm refuses to run any by
# default and treats the refusal as fatal on CI (ERR_PNPM_IGNORED_BUILDS), which
# is what broke EAS Build:
#   - @sentry/cli     fetches the sentry-cli binary that @sentry/react-native's
#                     Gradle plugin shells out to for the source-map upload.
#   - unrs-resolver   selects its platform napi binary; backs eslint's import
#                     resolution (pnpm lint).
#
# BOTH keys below are required, because the setting was renamed across the major
# version boundary we straddle: local dev runs pnpm 10, EAS Build runs pnpm 11.
# Each version reads its own key and ignores the other. Keep them in sync.
# Deliberately an allow-list — do not swap either for a blanket allow-all.

# Metro needs a hoisted node_modules to resolve pnpm's layout (see AGENTS.md).
# .npmrc sets `node-linker=hoisted` for pnpm 10, but pnpm 11 no longer reads that
# setting from .npmrc — without the line below it silently falls back to
# "isolated", which is what EAS Build (pnpm 11) had been doing.
nodeLinker: hoisted

# pnpm 11+ (EAS Build)
allowBuilds:
  '@sentry/cli': true
  unrs-resolver: true

# pnpm 10 (local dev)
onlyBuiltDependencies:
  - '@sentry/cli'
  - unrs-resolver
